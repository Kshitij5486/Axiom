name: Build and Deploy to Staging
on:
  push:
    branches: [master, main]
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest dowhy networkx scikit-learn lifelines stable-baselines3 gymnasium torch transformers grpcio grpcio-tools
      - name: Run unit tests
        env:
          PYTHONPATH: services/causal-engine:services/zk-service:services/federated-service:services/survival-service:services/nlp-service
        run: python -m pytest tests/unit/ -v --tb=short
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Staging deployment
        run: echo "All tests passed - deploying to axiom-staging"
