global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: axiom-clinical
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: axiom-causal-engine
    static_configs:
      - targets: ["causal-engine:8081"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: axiom-survival-service
    static_configs:
      - targets: ["survival-service:8082"]
    metrics_path: /metrics

  - job_name: axiom-nlp-service
    static_configs:
      - targets: ["nlp-service:8083"]
    metrics_path: /metrics

  - job_name: axiom-zk-service
    static_configs:
      - targets: ["zk-service:8084"]
    metrics_path: /metrics

  - job_name: axiom-federated-service
    static_configs:
      - targets: ["federated-service:8085"]
    metrics_path: /metrics

  - job_name: axiom-api-gateway
    static_configs:
      - targets: ["api-gateway:4000"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: sentinel-control-plane
    static_configs:
      - targets: ["localhost:9182"]
    metrics_path: /metrics
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: sentinel-control-plane

  - job_name: sentinel-graph-service
    static_configs:
      - targets: ["localhost:8091"]
    metrics_path: /metrics
    scrape_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: sentinel-graph-service

  - job_name: sentinel-correlator
    static_configs:
      - targets: ["localhost:8092"]
    metrics_path: /metrics
    scrape_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: sentinel-correlator

  - job_name: sentinel-zk-service
    static_configs:
      - targets: ["localhost:8085"]
    metrics_path: /metrics
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: sentinel-zk-service
