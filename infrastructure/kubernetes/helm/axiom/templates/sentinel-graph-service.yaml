{{- if .Values.sentinelGraph.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-graph-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: sentinel-graph-service
    component: network-security
spec:
  replicas: {{ .Values.sentinelGraph.replicas }}
  selector:
    matchLabels:
      app: sentinel-graph-service
  template:
    metadata:
      labels:
        app: sentinel-graph-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: sentinel-graph-service
          image: {{ .Values.global.image.registry }}/sentinel-graph-service:{{ .Values.sentinelGraph.image.tag }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.sentinelGraph.port }}
              name: api
          env:
            - name: DB_HOST
              value: {{ .Values.postgres.host }}
            - name: DB_PORT
              value: "{{ .Values.postgres.port }}"
            - name: DB_NAME
              value: {{ .Values.postgres.database }}
            - name: DB_USER
              value: {{ .Values.postgres.username }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: password
            - name: KAFKA_BROKERS
              value: {{ .Values.sentinelControlPlane.kafka.brokers }}
          resources:
            requests:
              memory: {{ .Values.sentinelGraph.resources.requests.memory }}
              cpu: {{ .Values.sentinelGraph.resources.requests.cpu }}
            limits:
              memory: {{ .Values.sentinelGraph.resources.limits.memory }}
              cpu: {{ .Values.sentinelGraph.resources.limits.cpu }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.sentinelGraph.port }}
            initialDelaySeconds: 20
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-graph-service
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: sentinel-graph-service
  ports:
    - name: api
      port: {{ .Values.sentinelGraph.port }}
      targetPort: {{ .Values.sentinelGraph.port }}
{{- end }}
