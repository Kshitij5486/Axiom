global:
  imageRegistry: ghcr.io/kshitij5486/axiom
  imageTag: latest
  namespace: axiom-clinical

causalEngine:
  replicas: 2
  image: causal-engine
  port: 8081
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 1Gi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPU: 70

apiGateway:
  replicas: 2
  image: api-gateway
  graphqlPort: 4000
  wsPort: 4001
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

dashboard:
  replicas: 2
  image: dashboard
  port: 80
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}

postgres:
  storage: 10Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 500m, memory: 1Gi}

monitoring:
  prometheus:
    enabled: true
    retention: 30d
  grafana:
    enabled: true

istio:
  enabled: true
  mtls: STRICT
