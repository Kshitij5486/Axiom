apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: axiom-clinical
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: api-gateway
        image: ghcr.io/kshitij5486/axiom/api-gateway:latest
        ports:
        - containerPort: 4000
          name: graphql
        - containerPort: 4001
          name: websocket
        envFrom:
        - configMapRef:
            name: axiom-config
        - secretRef:
            name: axiom-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: axiom-clinical
spec:
  selector:
    app: api-gateway
  ports:
  - name: graphql
    port: 4000
    targetPort: 4000
  - name: websocket
    port: 4001
    targetPort: 4001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: axiom-clinical
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
