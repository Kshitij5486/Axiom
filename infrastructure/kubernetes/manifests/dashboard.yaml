apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: axiom-clinical
  labels:
    app: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard
        image: ghcr.io/kshitij5486/axiom/dashboard:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: axiom-clinical
spec:
  selector:
    app: dashboard
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
