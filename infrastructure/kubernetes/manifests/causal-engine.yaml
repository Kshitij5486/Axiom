apiVersion: apps/v1
kind: Deployment
metadata:
  name: causal-engine
  namespace: axiom-clinical
  labels:
    app: causal-engine
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: causal-engine
  template:
    metadata:
      labels:
        app: causal-engine
        version: v1.0.0
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: causal-engine
        image: ghcr.io/kshitij5486/axiom/causal-engine:latest
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: axiom-config
        - secretRef:
            name: axiom-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: causal-engine
  namespace: axiom-clinical
spec:
  selector:
    app: causal-engine
  ports:
  - port: 8081
    targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: causal-engine-hpa
  namespace: axiom-clinical
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: causal-engine
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
