networks:
  axiom:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  minio_data:
  zookeeper_data:
  kafka_data:

services:

  postgres:
    image: postgres:15-alpine
    container_name: axiom-postgres
    environment:
      POSTGRES_USER: axiom_user
      POSTGRES_PASSWORD: axiom_secret
      POSTGRES_DB: axiom
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [axiom]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom_user -d axiom"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: axiom-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: axiom_user
      MONGO_INITDB_ROOT_PASSWORD: axiom_secret
      MONGO_INITDB_DATABASE: axiom_clinical
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks: [axiom]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: axiom-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks: [axiom]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: axiom-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks: [axiom]

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: axiom-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,PLAINTEXT_INTERNAL://kafka:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,PLAINTEXT_INTERNAL://0.0.0.0:29094
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [axiom]

  minio:
    image: minio/minio:latest
    container_name: axiom-minio
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: axiom_admin
      MINIO_ROOT_PASSWORD: axiom_secret123
    ports:
      - "9010:9000"
      - "9002:9002"
    volumes:
      - minio_data:/data
    networks: [axiom]
